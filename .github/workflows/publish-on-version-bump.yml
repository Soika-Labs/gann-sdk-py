name: Publish on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - __init__.py
      - pyproject.toml
      - .github/workflows/publish-on-version-bump.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
      exists: ${{ steps.pypi.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read version and compare with previous commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current=$(python -c "import pathlib,re; t=pathlib.Path('__init__.py').read_text(encoding='utf-8'); m=re.search(r'__version__\\s*=\\s*\"([^\"]+)\"', t); print(m.group(1) if m else '')")
          if [[ -z "$current" ]]; then
            echo "Unable to parse __version__ from __init__.py" >&2
            exit 1
          fi

          previous=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            previous=$(git show HEAD^:__init__.py 2>/dev/null | python -c "import re,sys; t=sys.stdin.read(); m=re.search(r'__version__\\s*=\\s*\"([^\"]+)\"', t); print(m.group(1) if m else '')")
          fi

          changed=true
          if [[ -n "$previous" && "$current" == "$previous" ]]; then
            changed=false
          fi

          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "current=$current previous=${previous:-<none>} changed=$changed"

      - name: Check if version already exists on PyPI
        id: pypi
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          exists=$(python -c "import json,urllib.request; v='${{ steps.version.outputs.version }}'; url='https://pypi.org/pypi/gann-sdk/json'; d=json.load(urllib.request.urlopen(url, timeout=10)); r=d.get('releases', {}); print('true' if v in r and len(r[v]) > 0 else 'false')" || echo "false")
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "pypi_exists=$exists"

  publish:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.changed == 'true' && needs.detect.outputs.exists == 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

  report:
    runs-on: ubuntu-latest
    needs: detect
    if: always()
    steps:
      - name: Report status
        run: |
          echo "version=${{ needs.detect.outputs.version }}"
          echo "changed=${{ needs.detect.outputs.changed }}"
          echo "exists_on_pypi=${{ needs.detect.outputs.exists }}"
